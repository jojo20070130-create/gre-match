<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>等价词速配</title>
<style>[hidden]{display:none!important}body{margin:0}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-screen game — status strip (timer · progress with reward stops) above two equal columns of word tiles. Study-desk ink blue with a highlighter accent. */
:root{
  --paper:#eaeef5;
  --tile:#ffffff;
  --ink:#16213b;
  --muted:#5d6884;
  --line:#c9d1e0;
  --hl:#ffe04a;
  --hl-ink:#3b3000;
  --ok:#1f9467;
  --bad:#d64545;
  --sel:#2f5bd3;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1524;--tile:#19223a;--ink:#e7ecf6;--muted:#97a2bd;--line:#2c3854;
  --hl:#ffd93a;--hl-ink:#2a2200;--ok:#3cc48d;--bad:#f06a6a;--sel:#7d9cff;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1524;--tile:#19223a;--ink:#e7ecf6;--muted:#97a2bd;--line:#2c3854;
  --hl:#ffd93a;--hl-ink:#2a2200;--ok:#3cc48d;--bad:#f06a6a;--sel:#7d9cff;color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
*{box-sizing:border-box}
.app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:18px;padding-block:18px;position:relative}

/* status strip */
.status{display:flex;align-items:center;gap:14px}
.clock{font-family:var(--f-mono);font-weight:600;font-size:1.35rem;font-variant-numeric:tabular-nums;min-width:3.6ch;text-align:right;position:relative}
.clock.low{color:var(--bad)}
.track{flex:1;position:relative;height:16px;border-radius:99px;background:var(--line)}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;background:var(--hl);transition:width .35s cubic-bezier(.3,1.4,.5,1)}
.stop{position:absolute;top:50%;width:26px;height:26px;margin-left:-13px;transform:translateY(-50%);border-radius:50%;
  background:var(--tile);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.62rem;font-weight:600;color:var(--muted)}
.stop.hit{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.stop.goal{border-radius:7px}
.count{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:4.5ch}
.float{position:absolute;right:0;top:-6px;font-family:var(--f-mono);font-size:.85rem;font-weight:600;pointer-events:none;opacity:0;white-space:nowrap}
.float.show{animation:rise .9s ease-out}
@keyframes rise{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-22px)}}

.caption{min-height:1.5em;text-align:center;color:var(--muted);font-size:.92rem}
.caption b{color:var(--ink)}
.combo{font-family:var(--f-mono);color:var(--sel);font-weight:600;margin-left:.4em}

/* board */
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.tile{font:700 clamp(.95rem,4vw,1.12rem)/1.15 var(--f-body);color:var(--ink);background:var(--tile);
  border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;min-height:62px;padding:8px 10px;
  cursor:pointer;transition:transform .08s, background .15s, border-color .15s, opacity .25s;overflow-wrap:anywhere;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tile.new{animation:popin .28s ease-out}
@keyframes popin{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{position:absolute;z-index:5;max-width:min(300px,calc(100% - 8px));background:var(--ink);color:var(--paper);
  border-radius:10px;padding:10px 12px;font-size:.92rem;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pop b{display:block;font-family:var(--f-display);font-size:1.05rem;margin-bottom:2px}
.tile:active{transform:translateY(2px)}
.tile:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.tile.sel{border-color:var(--sel);background:color-mix(in srgb,var(--sel) 12%,var(--tile))}
.tile.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--tile));color:var(--ok)}
.tile.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--tile));animation:shake .35s}
.tile.gone{opacity:0;pointer-events:none}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

.foot{margin-top:auto;text-align:center;font-size:.8rem;color:var(--muted)}

/* overlays */
.sheet{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:18px;background:var(--paper);padding-block:24px}
.sheet h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.4rem,11vw,3.4rem);line-height:1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sheet h1 mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 .08em}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:2.2rem;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rules{margin:0;padding-left:1.2em;display:grid;gap:6px;line-height:1.5;max-width:46ch}
.go{font:700 1.1rem var(--f-body);background:var(--ink);color:var(--paper);border:0;border-radius:12px;padding:14px 22px;cursor:pointer;align-self:flex-start}
.go:focus-visible{outline:3px solid var(--sel);outline-offset:3px}
.stats{display:flex;gap:22px;flex-wrap:wrap;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stats div span{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.stats div b{font-size:1.4rem}
.missed{display:grid;gap:6px;max-height:38vh;overflow:auto;border-top:1px solid var(--line);padding-top:12px}
.missed .row{display:grid;grid-template-columns:1fr auto;gap:10px}
.missed .row em{font-style:normal;color:var(--muted)}
.note{color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion: reduce){.tile.bad{animation:none}.float.show{animation:none;opacity:1}.fill{transition:none}}
.sheet{overflow:auto;justify-content:safe center}
.levels{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.lv{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;text-align:left;width:100%;
  font:inherit;color:var(--ink);background:var(--tile);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:12px 14px;cursor:pointer}
.lv:hover{border-color:var(--sel)}
.lv:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.lv .n{font-family:var(--f-mono);font-weight:600;font-size:.8rem;color:var(--hl-ink);background:var(--hl);border-radius:8px;width:30px;height:30px;display:grid;place-items:center}
.lv .t{font-family:var(--f-display);font-weight:800;font-size:1.25rem;line-height:1.1}
.lv .s{display:block;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.lv .bar{width:64px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.lv .bar i{display:block;height:100%;background:var(--ok)}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.go.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.menu{position:absolute;z-index:6;background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.menu button{font:700 .95rem var(--f-body);color:var(--ink);background:transparent;border:0;border-radius:7px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.menu button:hover,.menu button:focus-visible{background:color-mix(in srgb,var(--sel) 12%,var(--tile));outline:none}
.wordlist{display:grid;gap:2px;overflow:auto;min-height:0;flex:1;border-top:1px solid var(--line);padding-top:8px}
.wordlist .row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:6px 2px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.wordlist .row em{font-style:normal;color:var(--muted);text-align:right}
#study{justify-content:flex-start}
.lvname{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>


<div class="app">
  <div class="status">
    <div class="clock" id="clock">75<span class="float" id="float"></span></div>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
    <div class="count" id="count">0/20</div>
  </div>
  <div class="caption" id="caption">先点一个词，再点另一列里和它等价的词</div>
  <div class="board">
    <div class="col" id="colL"></div>
    <div class="col" id="colR"></div>
  </div>
  <div class="foot"><span class="lvname" id="lvname"></span> · 右键（手机长按）看英文释义</div>
  <div class="pop" id="pop" role="tooltip" hidden></div>

  <section class="sheet" id="start">
    <div class="eyebrow">GRE 六选二 · 等价词</div>
    <h1>等价词<mark>速配</mark></h1>
    <ol class="rules">
      <li>75 秒内配满 20 对就通关；第 6、13 对各奖励 8 秒，连对 3 次起每对加 1 秒，配错扣 3 秒。</li>
      <li>每消掉两对，四个空位一起随机刷新。</li>
      <li>每关按洗牌出词：整组词过完一遍才会重来，只有配错的词会提前回来。</li>
      <li>右键（手机长按）看英文释义，计时不停。</li>
    </ol>
    <div class="eyebrow">选一个词组 · 右键（手机长按）可以先背单词</div>
    <div class="levels" id="levels"></div>
  </section>

  <section class="sheet" id="study" hidden>
    <div class="eyebrow" id="studyEyebrow"></div>
    <h2 id="studyTitle"></h2>
    <div class="wordlist" id="wordlist"></div>
    <div class="row2">
      <button class="go" id="studyGo" type="button">开始这组</button>
      <button class="go ghost" id="studyBack" type="button">返回</button>
    </div>
  </section>

  <div class="menu" id="lvmenu" hidden><button type="button" id="lvStudy">背单词</button></div>

  <section class="sheet" id="end" hidden>
    <div class="eyebrow" id="endEyebrow"></div>
    <h2 id="endTitle"></h2>
    <div class="stats" id="stats"></div>
    <div class="missed" id="missed"></div>
    <div class="row2">
      <button class="go" id="againBtn" type="button">再来一局</button>
      <button class="go ghost" id="menuBtn" type="button">换词组</button>
    </div>
  </section>
</div>

const META = DATA.ranges.map((range, i) => ({ name: `词组 ${i + 1}`, range }));
const DEF = DATA.defs;
const LEVELS = DATA.groups.map(lv => lv.map((line, id) => {
  const [w, p, zh] = line.split('|');
  return { id, w, p, zh };
}));
// 所有关卡里互为等价的词，用来保证场上每个词只有一个合法搭档
const ADJ = {};
const link = (a, b) => { (ADJ[a] ??= new Set()).add(b); (ADJ[b] ??= new Set()).add(a); };
LEVELS.flat().forEach(P => link(P.w, P.p));

const TARGET = 20, START_MS = 75000, BONUS_MS = 8000, PENALTY_MS = 3000;
const STOPS = [6, 13], SLOTS = 5;

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const bagKey = n => `gre-eq-bag-v3-${n}`, missKey = n => `gre-eq-miss-v3-${n}`;

let S = null, pressTimer = null, suppressClick = false;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- 选关 ---------- */
function renderLevels() {
  const box = $('levels'); box.innerHTML = '';
  LEVELS.forEach((lv, n) => {
    const bag = store.get(bagKey(n), null);
    const done = bag ? lv.length - bag.length : 0;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lv'; b.id = `lv-${n}`;
    b.innerHTML = `<span><span class="t">${META[n].name}</span><span class="s">${lv.length} 对 · 本轮已练 ${done}</span></span>
      <span class="bar"><i style="width:${Math.round(done / lv.length * 100)}%"></i></span>`;
    b.addEventListener('click', () => { if (lvSuppress) { lvSuppress = false; return; } hideMenu(); start(n); });
    b.addEventListener('contextmenu', e => { e.preventDefault(); showMenu(n, e.clientX, e.clientY); });
    b.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse') return;
      clearTimeout(lvTimer);
      lvTimer = setTimeout(() => { lvSuppress = true; showMenu(n, e.clientX, e.clientY); }, 450);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => clearTimeout(lvTimer)));
    box.appendChild(b);
  });
}

let lvTimer = null, lvSuppress = false, menuLevel = 0;
function showMenu(n, x, y) {
  menuLevel = n;
  const m = $('lvmenu'), app = document.querySelector('.app').getBoundingClientRect();
  m.hidden = false;
  m.style.left = Math.max(0, Math.min(x - app.left, app.width - m.offsetWidth)) + 'px';
  m.style.top = Math.max(0, Math.min(y - app.top, app.height - m.offsetHeight)) + 'px';
  $('lvStudy').focus({ preventScroll: true });
}
function hideMenu() { $('lvmenu').hidden = true; }
function openStudy(n) {
  hideMenu();
  const lv = LEVELS[n];
  $('studyEyebrow').textContent = `${lv.length} 对`;
  $('studyTitle').textContent = META[n].name;
  $('wordlist').innerHTML = lv.map(P => `<div class="row"><span><b>${P.w}</b> = <b>${P.p}</b></span><em>${P.zh}</em></div>`).join('');
  $('wordlist').scrollTop = 0;
  $('studyGo').onclick = () => start(n);
  $('start').hidden = true; $('study').hidden = false;
}
$('lvStudy').addEventListener('click', () => openStudy(menuLevel));
$('studyBack').addEventListener('click', () => { $('study').hidden = true; renderLevels(); $('start').hidden = false; });
document.addEventListener('pointerdown', e => { if (!e.target.closest('#lvmenu')) hideMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideMenu(); });

/* ---------- 棋盘 ---------- */
const colL = $('colL'), colR = $('colR'), tilesL = [], tilesR = [];
for (let i = 0; i < SLOTS; i++) {
  for (const [col, arr, side] of [[colL, tilesL, 'L'], [colR, tilesR, 'R']]) {
    const b = document.createElement('button');
    b.className = 'tile'; b.type = 'button'; b.id = `tile-${side}${i}`;
    b.addEventListener('click', () => { if (suppressClick) { suppressClick = false; return; } hidePop(); tap(side, i); });
    b.addEventListener('contextmenu', e => { e.preventDefault(); showDef(side, i, b); });
    b.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse') return;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => { suppressClick = true; showDef(side, i, b); }, 450);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => clearTimeout(pressTimer)));
    col.appendChild(b); arr.push(b);
  }
}
STOPS.concat([TARGET]).forEach(n => {
  const s = document.createElement('div');
  s.className = 'stop' + (n === TARGET ? ' goal' : '');
  s.style.left = (n / TARGET * 100) + '%';
  s.textContent = n === TARGET ? '终' : '+8';
  s.dataset.n = n;
  $('track').appendChild(s);
});

function showDef(side, i, el) {
  if (!S || !S.running) return;
  const id = side === 'L' ? S.L[i] : S.R[i];
  if (id === null) return;
  const P = S.pool[id], word = side === 'L' ? P.w : P.p;
  const pop = $('pop');
  pop.innerHTML = `<b>${word}</b>${DEF[word] || '暂无释义'}`;
  pop.hidden = false;
  const app = document.querySelector('.app').getBoundingClientRect(), t = el.getBoundingClientRect();
  const w = pop.offsetWidth;
  const left = Math.max(0, Math.min(t.left - app.left + t.width / 2 - w / 2, app.width - w));
  let top = t.bottom - app.top + 6;
  if (top + pop.offsetHeight > app.height) top = t.top - app.top - pop.offsetHeight - 6;
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
function hidePop() { $('pop').hidden = true; }
document.addEventListener('pointerdown', e => { if (!e.target.closest('.tile')) hidePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hidePop(); });

/* ---------- 出词：洗牌 + 错题回流 + 同屏唯一答案 ---------- */
function boardWords() {
  const v = new Set();
  S.L.forEach(id => { if (id !== null) v.add(S.pool[id].w); });
  S.R.forEach(id => { if (id !== null) v.add(S.pool[id].p); });
  return v;
}
function fits(id, vis, active) {
  if (active.has(id)) return false;
  const P = S.pool[id];
  if (vis.has(P.w) || vis.has(P.p)) return false;
  for (const v of vis) if (ADJ[P.w].has(v) || ADJ[P.p].has(v)) return false;
  return true;
}
function pickNext() {
  const vis = boardWords();
  const active = new Set([...S.L, ...S.R].filter(x => x !== null));
  const qi = S.queue.findIndex(q => q.due <= S.matches && fits(q.id, vis, active));
  if (qi >= 0) { const id = S.queue[qi].id; S.queue.splice(qi, 1); return id; }
  for (let round = 0; round < 2; round++) {
    if (!S.bag.length) S.bag = shuffle(S.pool.map(P => P.id).filter(id => !active.has(id)));
    const bi = S.bag.findIndex(id => fits(id, vis, active));
    if (bi >= 0) { const id = S.bag[bi]; S.bag.splice(bi, 1); store.set(bagKey(S.level), S.bag); return id; }
    if (round === 0 && S.bag.length) break;
  }
  const any = S.pool.find(P => fits(P.id, vis, active));
  return any ? any.id : null;
}

/* ---------- 一局 ---------- */
function start(level) {
  if (S && S.timer) clearInterval(S.timer);
  const pool = LEVELS[level];
  let bag = store.get(bagKey(level), null);
  if (!Array.isArray(bag) || bag.some(id => !pool[id])) bag = shuffle(pool.map(P => P.id));
  const queue = store.get(missKey(level), []).filter(id => pool[id]).map((id, k) => ({ id, due: Math.floor(k / 2) }));
  S = {
    level, pool, bag, queue,
    L: Array(SLOTS).fill(null), R: Array(SLOTS).fill(null),
    sel: null, lock: new Set(), fresh: new Set(), emptyL: [], emptyR: [],
    matches: 0, combo: 0, errors: 0, timeLeft: START_MS, last: 0, running: false,
    missed: new Map(), stopsHit: new Set(), timer: null
  };
  const ids = [];
  for (let i = 0; i < SLOTS; i++) { const id = pickNext(); ids.push(id); S.L[i] = id; S.R[i] = id; }
  S.L = shuffle(ids.slice()); S.R = shuffle(ids.slice());
  document.querySelectorAll('.stop').forEach(s => s.classList.remove('hit'));
  $('caption').textContent = '先点一个词，再点另一列里和它等价的词';
  $('lvname').textContent = META[level].name;
  $('start').hidden = true; $('end').hidden = true; $('study').hidden = true; hideMenu();
  S.running = true; S.last = Date.now();
  S.timer = setInterval(tick, 100);
  render();
  tilesL[0].focus({ preventScroll: true });
}

function tick() {
  const now = Date.now();
  S.timeLeft -= now - S.last; S.last = now;
  if (S.timeLeft <= 0) { S.timeLeft = 0; finish(false); }
  renderClock();
}
function renderClock() {
  const sec = Math.ceil(S.timeLeft / 1000), c = $('clock');
  c.firstChild.nodeValue = sec;
  c.classList.toggle('low', sec <= 10);
}
function render() {
  for (let i = 0; i < SLOTS; i++) { paint(tilesL[i], S.L[i], 'L', i); paint(tilesR[i], S.R[i], 'R', i); }
  $('fill').style.width = Math.min(100, S.matches / TARGET * 100) + '%';
  $('count').textContent = `${S.matches}/${TARGET}`;
  renderClock();
}
function paint(el, id, side, i) {
  const key = side + i;
  if (S.lock.has(key)) return;
  const isNew = S.fresh.delete(key);
  el.className = 'tile' + (id === null ? ' gone' : '') + (isNew ? ' new' : '') + (S.sel && S.sel.side === side && S.sel.i === i ? ' sel' : '');
  el.textContent = id === null ? '' : (side === 'L' ? S.pool[id].w : S.pool[id].p);
}

function tap(side, i) {
  if (!S || !S.running) return;
  const id = side === 'L' ? S.L[i] : S.R[i];
  if (id === null || S.lock.has(side + i)) return;
  if (!S.sel || S.sel.side === side) {
    S.sel = (S.sel && S.sel.i === i && S.sel.side === side) ? null : { side, i };
    render(); return;
  }
  const l = side === 'L' ? i : S.sel.i, r = side === 'R' ? i : S.sel.i;
  S.sel = null;
  if (S.L[l] === S.R[r]) correct(l, r); else wrong(l, r);
}

function flash(text, color) {
  const f = $('float');
  f.textContent = text; f.style.color = color;
  f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
}

function correct(l, r) {
  const P = S.pool[S.L[l]];
  S.matches++; S.combo++;
  let bonus = S.combo >= 3 ? 1000 : 0;
  STOPS.forEach(n => {
    if (S.matches === n && !S.stopsHit.has(n)) {
      S.stopsHit.add(n); bonus += BONUS_MS;
      document.querySelector(`.stop[data-n="${n}"]`).classList.add('hit');
    }
  });
  if (bonus) { S.timeLeft += bonus; flash(`+${bonus / 1000}秒`, 'var(--ok)'); }
  $('caption').innerHTML = `<b>${P.w}</b> = <b>${P.p}</b> · ${P.zh}` + (S.combo >= 3 ? `<span class="combo">连对 ${S.combo}</span>` : '');
  const kl = 'L' + l, kr = 'R' + r;
  S.lock.add(kl); S.lock.add(kr);
  tilesL[l].className = 'tile ok'; tilesR[r].className = 'tile ok';
  render();
  if (S.matches >= TARGET) {
    S.running = false; clearInterval(S.timer);
    document.querySelector(`.stop[data-n="${TARGET}"]`).classList.add('hit');
    setTimeout(() => { S.running = true; finish(true); }, 450);
    return;
  }
  setTimeout(() => {
    if (!S.running) return;
    S.L[l] = null; S.R[r] = null;
    S.lock.delete(kl); S.lock.delete(kr);
    S.emptyL.push(l); S.emptyR.push(r);
    if (S.emptyL.length >= 2) refill();
    render();
  }, 300);
}

function refill() {
  // 两对新词随机落进四个空位：可能同排，也可能交叉
  const ls = shuffle(S.emptyL.splice(0, 2)), rs = shuffle(S.emptyR.splice(0, 2));
  for (let k = 0; k < 2; k++) {
    const id = pickNext();
    if (id === null) { S.emptyL.push(ls[k]); S.emptyR.push(rs[k]); continue; }
    S.L[ls[k]] = id; S.R[rs[k]] = id;
    S.fresh.add('L' + ls[k]); S.fresh.add('R' + rs[k]);
  }
}

function wrong(l, r) {
  S.combo = 0; S.errors++;
  S.timeLeft = Math.max(0, S.timeLeft - PENALTY_MS);
  flash(`-${PENALTY_MS / 1000}秒`, 'var(--bad)');
  [S.L[l], S.R[r]].forEach(id => {
    S.missed.set(id, (S.missed.get(id) || 0) + 1);
    if (!S.queue.some(q => q.id === id)) S.queue.push({ id, due: S.matches + 3 });
  });
  const kl = 'L' + l, kr = 'R' + r;
  S.lock.add(kl); S.lock.add(kr);
  tilesL[l].className = 'tile bad'; tilesR[r].className = 'tile bad';
  $('caption').textContent = '这两个不是一对';
  setTimeout(() => { S.lock.delete(kl); S.lock.delete(kr); if (S.running) render(); }, 420);
  renderClock();
}

function finish(won) {
  if (!S.running) return;
  S.running = false; clearInterval(S.timer); hidePop();
  const missedIds = [...S.missed.keys()];
  const prev = store.get(missKey(S.level), []);
  store.set(missKey(S.level), [...new Set(missedIds.concat(prev))].slice(0, 40));
  store.set(bagKey(S.level), S.bag);

  $('endEyebrow').textContent = `${META[S.level].name} · ${won ? '走完全程' : '时间到'}`;
  $('endTitle').textContent = won ? '通关' : `配了 ${S.matches} 对`;
  const done = S.pool.length - S.bag.length;
  $('stats').innerHTML =
    `<div><span>配对</span><b>${S.matches}/${TARGET}</b></div>` +
    `<div><span>配错</span><b>${S.errors}</b></div>` +
    `<div><span>本轮已练</span><b>${done}/${S.pool.length}</b></div>`;
  $('missed').innerHTML = missedIds.length
    ? '<div class="eyebrow">这局配错过的词，下局会更早出现</div>' +
      missedIds.map(id => { const P = S.pool[id]; return `<div class="row"><span><b>${P.w}</b> = <b>${P.p}</b></span><em>${P.zh}</em></div>`; }).join('')
    : '<div class="note">这局一次都没配错。</div>';
  $('end').hidden = false;
  $('againBtn').focus({ preventScroll: true });
}

$('againBtn').addEventListener('click', () => start(S.level));
$('menuBtn').addEventListener('click', () => { $('end').hidden = true; renderLevels(); $('start').hidden = false; });
renderLevels();
</script>
